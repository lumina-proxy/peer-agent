server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    types {
        text/plain sh ps1 txt;
        application/gzip gz;
        application/zip zip;
        application/vnd.debian.binary-package deb;
        application/x-rpm rpm;
    }
    default_type text/plain;
    charset utf-8;

    location = /healthz {
        return 200 "ok\n";
    }

    location = /downloads {
        return 302 https://luminaproxy.com/earn;
    }

    location = /downloads/ {
        return 302 https://luminaproxy.com/earn;
    }

    location ~ ^/downloads/v[0-9][^/]*/ {
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /downloads/ {
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
